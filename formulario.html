<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <h2>Início de Formulário</h2>
    <form action="" method="get">
        Informe seu nome completo:<br/>
        <input type="text" name="nome" id="nome"><br/>
        
        Selecione o tipo de combustível:<br/>
        <input type="radio" name="gas" id="gas" value="combus">Gasolina<br/>
        <input type="radio" name="alc" id="alc" value="combus">Alcool<br/>
        <input type="radio" name="gnv" id="gnv" value="combus">GNV<br/>
        <input type="radio" name="flex" id="flex" value="combus">Flex<br/>

        Escolha o fabricante do carro: <br/>
        <select name="car" id="car" >
            <option value="Fiat">Fiat</option>
            <option value="Hyundai">Hyundai</option>
            <option value="BYD">BYD</option>
            <option value="Honda" selected >Honda</option>
        </select>
        <br/>
        Sugestôes: <br/>
        <textarea name="dica" id="dica" cols="20" rows="5"></textarea>   
</body>
</html>
